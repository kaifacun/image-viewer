[package]
name = "iv-video"
description = "비디오 재생 (macOS AVFoundation AVPlayer + 프레임 출력) — 프레임은 iv_core::Frame 으로 렌더러 이미지 경로에 올린다"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
iv-core.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media", "objc2-core-graphics", "objc2-core-foundation", "objc2-core-video"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-foundation = { version = "0.3", features = ["NSRunLoop", "NSDate"] }
